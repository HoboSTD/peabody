    <script>
    var selectedTimezoneID = "USE_DEFAULT_TIMEZONE";
    const siteTimezoneID = "Australia/Sydney";
    // selectedTimezoneID = Intl.DateTimeFormat().resolvedOptions().timeZone; // <-- force overrride to the user's timezone.

    $(document).ready(function () {
        var url = location.href;
        var spliturl = url.split("?");
        var commitChangeStartDate = false;
        var commitChangeStartTime = false;
        var commitChangeEndDate = false;
        var commitChangeEndTime = false;

        var sessionCachedTimezoneOption = sessionStorage.getItem("timezoneOption");
        switch (sessionCachedTimezoneOption) {
            case "timezone_site":
                selectedTimezoneID = siteTimezoneID;
            break;
            case "timezone_client":
                selectedTimezoneID = Intl.DateTimeFormat().resolvedOptions().timeZone;
            break;

            case "timezone_universal":
                selectedTimezoneID = "Etc/UTC";
            break;

            default:
                selectedTimezoneID = siteTimezoneID;
            break;
        }

        // Add styling to menu link of the page we are currently on
        $('a.nav-link:not(.groupManagementTab), .dropdown-menu>li>a').each(function(element) {
            if ($(this).attr('href') != "#") {
             var navItemUrl = this.href.toLowerCase().split("?")[0];
             if (spliturl[0].toLowerCase().replace("#","") == navItemUrl && navItemUrl[navItemUrl.length - 1] != "#") {                
                 $(this).addClass('selectedMenu');
             }
             else { 
                $(this).removeClass('selectedMenu');
             }
            }
        });

        // Expansion of all relevant drop down menus, if required to show our highlighted nav link.
        var allParentsExpanded = false;
        var currentChild = $(".selectedMenu:not(.groupManagementTab)");
        if (currentChild.length == 0) allParentsExpanded = true;
        while (!allParentsExpanded) {
            var thisParent = currentChild.parent().parent();
            var ddm = thisParent.siblings(".dropdown-item, .dropdown-toggle");
            if (ddm.length > 0) {
                ddm.addClass('expanded');
                thisParent.toggle();
                currentChild = thisParent;
            }
            else {
                allParentsExpanded = true;
            }
        }

        var sessionCachedStartDate = sessionStorage.getItem("QueryStartDate");
        var sessionCachedEndDate = sessionStorage.getItem("QueryEndDate");
        if (spliturl.length > 1) {
            var querystring = spliturl[1].split("&");
            var relStartDate = new Date();
            var relEndDate = new Date();
            for (var i = 0; i < querystring.length; i++) {
                var parameters = querystring[i].split("=");
                for (var j = 0; j < parameters.length; j += 2) {
                    if (parameters[j] == "RelativeStartDay") {
                        relStartDate = new Date(GParseTime("[" + parameters[j + 1] + "]", relStartDate));
                        commitChangeStartDate = true;
                    }
                    else if (parameters[j] == "RelativeStartTime") {
                        relStartDate = new Date(GParseTime("[" + parameters[j + 1] + "]", relStartDate));
                        commitChangeStartTime = true;
                    }
                    else if (parameters[j] == "RelativeEndDay") {
                        relEndDate = new Date(GParseTime("[" + parameters[j + 1] + "]", relEndDate));
                        commitChangeEndDate = true;
                    }
                    else if (parameters[j] == "RelativeEndTime") {
                        relEndDate = new Date(GParseTime("[" + parameters[j + 1] + "]", relEndDate));
                        commitChangeEndTime = true;
                    }
                    else if (parameters[j] == "StartDate") {
                        var exactstartdate = new Date(unescape(parameters[j + 1]));
                        relStartDate = exactstartdate;
                        commitChangeStartDate = true;
                        commitChangeStartTime = true;
                    }
                    else if (parameters[j] == "EndDate") {
                        var exactenddate = new Date(unescape(parameters[j + 1]));
                        relEndDate = exactenddate;
                        commitChangeEndDate = true;
                        commitChangeEndTime = true;
                    }
                }
            }
            if (commitChangeStartDate || commitChangeStartTime) {
                var now = new Date();
                relStartDate.setMinutes(relStartDate.getMinutes() - now.getTimezoneOffset());
                $("#dateTime-startdate").val(relStartDate.toISOString().substring(0, 19));
            }
            else if (sessionCachedStartDate != null) {
                $("#dateTime-startdate").val(sessionStorage.getItem("QueryStartDate"));
            }
            if (commitChangeEndDate || commitChangeEndTime) {
                var now = new Date();
                relEndDate.setMinutes(relEndDate.getMinutes() - now.getTimezoneOffset());
                $("#dateTime-enddate").val(relEndDate.toISOString().substring(0, 19));
            }
            else if (sessionCachedEndDate != null) {
                $("#dateTime-enddate").val(sessionStorage.getItem("QueryEndDate"));
            }
        }
        // If we have session-cached calendar values, make sure we don't override them in future calendar setup
        if (sessionCachedStartDate != null && sessionCachedEndDate != null && !commitChangeEndDate && !commitChangeEndTime && !commitChangeStartDate && !commitChangeStartTime) {
            $("#dateTime-startdate").val(sessionStorage.getItem("QueryStartDate"));
            $("#dateTime-enddate").val(sessionStorage.getItem("QueryEndDate"));
            commitChangeStartDate = true;
            commitChangeStartTime = true;
            commitChangeEndDate = true;
            commitChangeEndTime = true;
        }
        // Configure Calendars using defaults; if we have not already committed to changing them
        var defaultStartDate = "-1d";
        var defaultStartTime = "soh";
        var defaultEndDate = "*";
        var defaultEndTime = "soh";
        ConfigureCalendarDefaultValues(defaultStartDate, commitChangeStartDate, defaultStartTime, commitChangeStartTime, defaultEndDate, commitChangeEndDate, defaultEndTime, commitChangeEndTime);        

        ConfigureCalendarBounds("-3y","*");
        //$("#dateTime-enddate").attr("max", relativeDay("*", maxdate1));
        //$("#RefreshAllGraphs").click();

        // Initialise Event Listener so that a manual click updates the session cached start and end query dates
        $("#RefreshAllGraphs").click(function (e) {
            if (e.hasOwnProperty('originalEvent')) {
                sessionStorage.setItem("QueryStartDate", $("#dateTime-startdate").val());
                sessionStorage.setItem("QueryEndDate", $("#dateTime-enddate").val());
            }
        });
    });


    // Create a new page
function CreateNewPagePrompt() {
    var NewPageURL = "gHostModules/DisplayBuilder/NewPageForm";
    $.ajax({
        url: NewPageURL,
        type: 'GET',
        data: { },
        success: function (shape) {
            // Update Value Widget HTML
            $("#fullscreenWidgetModal").html(shape);
            $("#fullscreenWidgetModal").removeClass('hidden');

        },
        error: function () {
            // TODO Handle error
        }
    });
    
}
    </script>
